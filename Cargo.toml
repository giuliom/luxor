[package]
name = "luxor"
version = "0.1.0"
edition = "2021"
# The default feature set builds postgresql_embedded and its sqlx 0.9, which
# declare 1.94; without embedded-postgres the graph needs only 1.88.
rust-version = "1.94"

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.10.3", features = ["cookie"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = "9.3.1"
opentelemetry = "0.24.0"
opentelemetry-otlp = { version = "0.17.0", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.24.1", features = ["rt-tokio"] }
postgresql_embedded = { version = "0.20.4", default-features = false, features = ["rustls", "theseus", "tokio"], optional = true }
rand = "0.8.6"
redis = { version = "0.27.6", features = ["aio", "connection-manager", "tokio-comp"] }
# Depended on only to fix the process-level crypto provider at startup; every
# actual TLS connection is made by sqlx, sentry, or reqwest. Default features
# would select aws-lc-rs, which would add a C toolchain dependency to the
# production image; ring is what that image already compiles.
rustls = { version = "0.23.41", default-features = false, features = ["logging", "ring", "std", "tls12"] }
secrecy = { version = "0.10.3", features = ["serde"] }
sentry = { version = "0.36.0", default-features = false, features = ["contexts", "panic", "reqwest", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0.18"
time = "0.3.53"
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.25.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
zxcvbn = { version = "3.1.1", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3.32", default-features = false }
http-body-util = "0.1.3"
# test-util (paused-clock tests) stays out of release binaries.
tokio = { version = "1.52.3", features = ["full", "test-util"] }
# A WebSocket client for the end-to-end realtime test. Plain ws:// only, so
# the TLS features stay off; the version tracks the one axum's ws feature uses.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }

# The embedded development PostgreSQL server keeps local runs free of Docker.
# Production images build with --no-default-features; their configuration
# requires DATABASE_URL, so they never take the embedded path.
[features]
default = ["embedded-postgres"]
embedded-postgres = ["dep:postgresql_embedded"]
