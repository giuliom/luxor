[package]
name = "luxor"
version = "0.1.0"
edition = "2021"
# The default feature set builds postgresql_embedded and its sqlx 0.9, which
# declare 1.94; without embedded-postgres the graph needs only 1.88.
rust-version = "1.94"

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
axum-extra = { version = "0.10.3", features = ["cookie"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
# Precompresses the rendered pages and embedded static files once at startup.
# The default backend is miniz_oxide, pure Rust, so no C toolchain is added.
flate2 = "1.1.9"
jsonwebtoken = "9.3.1"
opentelemetry = { version = "0.24.0", optional = true }
opentelemetry-otlp = { version = "0.17.0", features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.24.1", features = ["rt-tokio"], optional = true }
postgresql_embedded = { version = "0.20.4", default-features = false, features = ["rustls", "theseus", "tokio"], optional = true }
rand = "0.8.6"
# librdkafka bindings, built from the vendored C sources. "tracing" routes the
# library's own log output through this application's subscriber instead of the
# `log` facade. "ssl-vendored" compiles and statically links OpenSSL, which
# librdkafka needs for TLS and for SASL SCRAM: the alternative, linking the
# system OpenSSL, would make `cargo run` depend on a pkg-config and libssl-dev
# installation on every developer machine. It is the only OpenSSL in the
# process — everything else here speaks TLS through rustls — and it is updated
# by bumping openssl-src rather than the base image. The Cyrus SASL ("gssapi")
# feature stays off, so SASL PLAIN, SCRAM, and OAUTHBEARER are available and
# Kerberos is not.
rdkafka = { version = "0.39.0", features = ["ssl-vendored", "tracing"], optional = true }
redis = { version = "0.27.6", features = ["aio", "connection-manager", "tokio-comp"], optional = true }
# Depended on only to fix the process-level crypto provider at startup; every
# actual TLS connection is made by sqlx, sentry, or reqwest. Default features
# would select aws-lc-rs, which would add a C toolchain dependency to the
# production image; ring is what that image already compiles.
rustls = { version = "0.23.41", default-features = false, features = ["logging", "ring", "std", "tls12"] }
secrecy = { version = "0.10.3", features = ["serde"] }
sentry = { version = "0.36.0", default-features = false, features = ["contexts", "panic", "reqwest", "rustls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2.0.18"
time = "0.3.53"
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.25.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
zxcvbn = { version = "3.1.1", default-features = false }

[dev-dependencies]
# The package itself, so that its own tests are compiled with the `test-util`
# helpers. Default features stay off here, so a test run builds exactly the
# feature set named on the command line plus `test-util`.
luxor = { path = ".", default-features = false, features = ["test-util"] }
futures-util = { version = "0.3.32", default-features = false }
http-body-util = "0.1.3"
# test-util (paused-clock tests) stays out of release binaries.
tokio = { version = "1.52.3", features = ["full", "test-util"] }
# A WebSocket client for the end-to-end realtime test. Plain ws:// only, so
# the TLS features stay off; the version tracks the one axum's ws feature uses.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }

# Each backend and capability is a feature, so a project built from this
# template compiles only what it uses. Every optional backend has an in-memory
# or no-op stand-in, and a setting that belongs to a feature this build
# excludes fails startup instead of being ignored.
[features]
default = ["embedded-postgres", "app"]
# What the deployed binary is built with: the default set minus the embedded
# development database. The Dockerfile builds exactly this feature, so trimming
# the application is an edit to this list.
app = ["redis", "kafka", "otel", "sentry", "realtime", "demo"]
# The embedded development PostgreSQL server keeps local runs free of Docker.
# Production images build without it; their configuration requires
# DATABASE_URL, so they never take the embedded path.
embedded-postgres = ["dep:postgresql_embedded"]
# Redis-backed cache, queue, and rate limiter, shared across instances.
redis = ["dep:redis"]
# Domain events on a Kafka topic (librdkafka, built from vendored sources).
kafka = ["dep:rdkafka"]
# OpenTelemetry tracing: trace-context propagation, OTLP export, and the
# in-process span store.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
# Sentry error reporting.
sentry = ["dep:sentry"]
# Ticket-authenticated WebSocket fan-out.
realtime = ["axum/ws"]
# The reference browser console and the demo endpoints it exercises. A real
# project drops this feature, then deletes src/demo and the code marked
# `feature = "demo"` (see the README).
demo = ["otel", "realtime"]
# Test helpers (`luxor::testing`); enabled automatically for this package's
# own tests by the dev-dependency above.
test-util = []
